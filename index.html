<!doctype html>
<html lang="en" data-ui-theme="dark">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var t = s.uiTheme;
            document.documentElement.dataset.uiTheme =
              t === 'light' ? 'light' : t === 'glass' ? 'glass' : 'dark';
            return;
          }
        } catch (e) { /* ignore */ }
        document.documentElement.dataset.uiTheme = 'dark';
      })();
    </script>

    <style>
      /* Critical boot loader — logo MP4 until React AppLoadingScreen takes over */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 10045;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1251f0 !important;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      #initial-loader #boot-logo-video {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
        left: -9999px;
      }
      #initial-loader #boot-logo-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #1251f0;
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader #boot-logo-video,
        #initial-loader #boot-logo-canvas { display: none !important; }
      }
      /* Firebase OAuth relay iframes — keep off-screen if layout glitches */
      iframe[src*="/__/auth/"],
      iframe[src*=".firebaseapp.com/__/auth"] {
        position: fixed !important;
        left: -9999px !important;
        top: 0 !important;
        width: 0 !important;
        height: 0 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        border: 0 !important;
        clip: rect(0, 0, 0, 0) !important;
      }
    </style>

  <body>
    <script>
      (function() {
        var ruler = document.createElement('div');
        ruler.style.cssText = 'position:fixed;width:1px;height:100vh;top:0;pointer-events:none;visibility:hidden;';
        document.body.appendChild(ruler);
        function setViewportHeight() {
          var h = ruler.offsetHeight || window.innerHeight;
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
        setViewportHeight();
        requestAnimationFrame(setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('resize', setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('scroll', setViewportHeight);
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('load', setViewportHeight);
      })();
    </script>
    <div id="root">
      <div id="initial-loader" aria-label="Loading KnockScout" role="status">
        <video
          id="boot-logo-video"
          class="boot-logo-video"
          src="/brand/knockscout-LogoMark.mp4"
          poster="/brand/knockscout-LogoMark-poster.png"
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          aria-hidden="true"
        ></video>
        <canvas id="boot-logo-canvas" aria-hidden="true"></canvas>
      </div>
    </div>
    <script>
      window.__removeInitialLoader = function() {
        if (typeof window.__stopBootLogoMirror === 'function') {
          window.__stopBootLogoMirror();
          window.__stopBootLogoMirror = null;
        }
        var el = document.getElementById('initial-loader');
        if (el) el.remove();
      };
      (function() {
        var video = document.getElementById('boot-logo-video');
        var canvas = document.getElementById('boot-logo-canvas');
        if (!video || !canvas) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          video.remove();
          canvas.remove();
          return;
        }
        var ctx = null;
        try {
          ctx = canvas.getContext('2d', { alpha: false, colorSpace: 'srgb' });
        } catch (e) {
          ctx = canvas.getContext('2d', { alpha: false });
        }
        if (!ctx) return;
        var raf = 0;
        var LOGO_SCALE = 1.875;
        var EDGE_COVER_RATIO = 0.035;
        var EDGE_COVER_MIN_PX = 3;
        var plateFill = '#1251f0';
        var probe = document.createElement('canvas');
        probe.width = 48;
        probe.height = 48;
        var probeCtx = null;
        try {
          probeCtx = probe.getContext('2d', { alpha: false, colorSpace: 'srgb' });
        } catch (e) {
          probeCtx = probe.getContext('2d', { alpha: false });
        }
        var fillPlate = function() {
          ctx.fillStyle = plateFill;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        };
        var syncSize = function() {
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          var cssW = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth));
          var cssH = Math.max(1, Math.round(canvas.clientHeight || window.innerHeight));
          var w = Math.round(cssW * dpr);
          var h = Math.round(cssH * dpr);
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
            fillPlate();
          }
          return { cssW: cssW, cssH: cssH, dpr: dpr };
        };
        var paint = function() {
          var size = syncSize();
          fillPlate();
          if (!(video.readyState >= 2 && video.videoWidth > 0) || !probeCtx) return;
          probeCtx.drawImage(video, 0, 0, probe.width, probe.height);
          var r = 0, g = 0, b = 0;
          try {
            var pix = probeCtx.getImageData(4, 4, 1, 1).data;
            r = pix[0]; g = pix[1]; b = pix[2];
          } catch (e) { return; }
          plateFill = 'rgb(' + r + ',' + g + ',' + b + ')';
          fillPlate();
          var vw = video.videoWidth;
          var vh = video.videoHeight;
          var fit = Math.min(size.cssW / vw, size.cssH / vh) * LOGO_SCALE;
          var dw = vw * fit * size.dpr;
          var dh = vh * fit * size.dpr;
          var dx = (canvas.width - dw) / 2;
          var dy = (canvas.height - dh) / 2;
          ctx.drawImage(video, dx, dy, dw, dh);
          var cover = Math.max(EDGE_COVER_MIN_PX * size.dpr, Math.round(dh * EDGE_COVER_RATIO));
          ctx.fillStyle = plateFill;
          ctx.fillRect(dx, dy, dw, cover);
          ctx.fillRect(dx, dy + dh - cover, dw, cover);
        };
        syncSize();
        fillPlate();
        var draw = function() {
          paint();
          raf = requestAnimationFrame(draw);
        };
        draw();
        window.addEventListener('resize', paint);
        window.__stopBootLogoMirror = function() {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', paint);
        };

        // Preload only — React starts the single synced play from t=0 (no boot timeline drift).
        video.muted = true;
        video.defaultMuted = true;
        video.volume = 1;
        video.preload = 'auto';
        var primeFrame = function() {
          try {
            video.currentTime = 0;
          } catch (e) { /* ignore */ }
          try {
            video.pause();
          } catch (e) { /* ignore */ }
          paint();
        };
        video.addEventListener('loadeddata', primeFrame, { once: true });
        if (video.readyState >= 2) primeFrame();
      })();
    </script>

</html>
