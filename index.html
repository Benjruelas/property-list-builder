<!doctype html>
<html lang="en" data-ui-theme="dark">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var t = s.uiTheme;
            document.documentElement.dataset.uiTheme =
              t === 'light' ? 'light' : t === 'glass' ? 'glass' : 'dark';
            return;
          }
        } catch (e) { /* ignore */ }
        document.documentElement.dataset.uiTheme = 'dark';
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111" />
    <title>KnockScout</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-title" content="KnockScout" />
    <meta name="application-name" content="KnockScout" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.googleapis.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin />
    <style>
      /* Critical boot loader — mirrors AppLoadingScreen until React takes over */
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-logo-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes boot-tagline { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
      @keyframes boot-progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(120%); } }
      @keyframes boot-orb-a {
        0%, 100% { transform: translateX(-50%) translate(0, 0) scale(1); }
        33% { transform: translateX(-50%) translate(28px, -20px) scale(1.12); }
        66% { transform: translateX(-50%) translate(-12px, 14px) scale(0.95); }
      }
      @keyframes boot-orb-b {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-24px, 22px) scale(0.92); }
        66% { transform: translate(18px, -10px) scale(1.08); }
      }
      @keyframes boot-grid { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.55; } }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 10045;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        overflow: hidden;
        margin: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #initial-loader .boot-bg { position: absolute; inset: 0; pointer-events: none; }
      #initial-loader .boot-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(72px);
        opacity: 0.55;
      }
      #initial-loader .boot-orb--a {
        width: min(70vw, 320px);
        height: min(70vw, 320px);
        top: 18%;
        left: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.55) 0%, transparent 70%);
        animation: boot-orb-a 9s ease-in-out infinite;
      }
      #initial-loader .boot-orb--b {
        width: min(55vw, 260px);
        height: min(55vw, 260px);
        bottom: 12%;
        right: 8%;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.4) 0%, transparent 72%);
        animation: boot-orb-b 11s ease-in-out infinite;
      }
      #initial-loader .boot-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 20%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black 20%, transparent 75%);
        animation: boot-grid 4s ease-in-out infinite;
      }
      #initial-loader .boot-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 2rem;
      }
      #initial-loader .boot-logo-wrap {
        position: relative;
        width: 7.5rem;
        height: 7.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #initial-loader .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: rgba(96, 165, 250, 0.85);
        border-right-color: rgba(59, 130, 246, 0.25);
        box-shadow: 0 0 24px rgba(59, 130, 246, 0.2);
        animation: boot-spin 2.8s linear infinite;
      }
      #initial-loader .boot-ring--inner {
        inset: 0.5rem;
        border-top-color: rgba(147, 197, 253, 0.5);
        border-right-color: transparent;
        box-shadow: none;
        animation: boot-spin 4.2s linear infinite reverse;
      }
      #initial-loader .boot-logo {
        position: relative;
        z-index: 1;
        width: 5.5rem;
        height: 5.5rem;
        border-radius: 1.125rem;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12),
          0 12px 40px rgba(0, 0, 0, 0.45),
          0 0 48px rgba(59, 130, 246, 0.15);
        animation: boot-logo-pulse 2.2s ease-in-out infinite;
      }
      #initial-loader .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.375rem;
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #initial-loader .boot-name {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #f8fafc;
        text-shadow: 0 2px 20px rgba(59, 130, 246, 0.35);
      }
      #initial-loader .boot-tagline {
        font-size: 0.8125rem;
        font-weight: 500;
        color: rgba(148, 163, 184, 0.95);
        letter-spacing: 0.02em;
        animation: boot-tagline 2.5s ease-in-out infinite;
      }
      #initial-loader .boot-progress {
        width: min(12rem, 56vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #initial-loader .boot-progress-fill {
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, transparent);
        animation: boot-progress 1.35s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        var ruler = document.createElement('div');
        ruler.style.cssText = 'position:fixed;width:1px;height:100vh;top:0;pointer-events:none;visibility:hidden;';
        document.body.appendChild(ruler);
        function setViewportHeight() {
          var h = ruler.offsetHeight || window.innerHeight;
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
        setViewportHeight();
        requestAnimationFrame(setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('resize', setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('scroll', setViewportHeight);
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('load', setViewportHeight);
      })();
    </script>
    <div id="root">
      <div id="initial-loader" aria-label="Loading KnockScout" role="status">
        <div class="boot-bg" aria-hidden="true">
          <div class="boot-orb boot-orb--a"></div>
          <div class="boot-orb boot-orb--b"></div>
          <div class="boot-grid"></div>
        </div>
        <div class="boot-content">
          <div class="boot-logo-wrap">
            <div class="boot-ring"></div>
            <div class="boot-ring boot-ring--inner"></div>
            <img src="/icon-512.png" alt="" class="boot-logo" width="88" height="88" />
          </div>
          <div class="boot-brand">
            <span class="boot-name">KnockScout</span>
            <span class="boot-tagline">Loading your map…</span>
          </div>
          <div class="boot-progress">
            <div class="boot-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__removeInitialLoader = function() {
        var el = document.getElementById('initial-loader');
        if (el) el.remove();
      };
    </script>
    <div id="modal-root" style="position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; isolation: isolate;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
