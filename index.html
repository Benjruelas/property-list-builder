<!doctype html>
<html lang="en" data-ui-theme="dark" style="background:#000000;color-scheme:dark">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var t = s.uiTheme;
            document.documentElement.dataset.uiTheme =
              t === 'light' ? 'light' : t === 'glass' ? 'glass' : 'dark';
            return;
          }
        } catch (e) { /* ignore */ }
        document.documentElement.dataset.uiTheme = 'dark';
      })();
    </script>
    <meta charset="UTF-8" />
    <script>
      /* iOS Home Screen recovery: prefer /recover.html (static) or ?recover=1 */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (!params.has('recover') && !params.has('nosw')) return;
          var finish = function () {
            params.delete('recover');
            params.delete('nosw');
            var q = params.toString();
            window.location.replace(window.location.pathname + (q ? '?' + q : '') + window.location.hash);
          };
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            );
          }
          if (typeof caches !== 'undefined' && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
            );
          }
          try { sessionStorage.removeItem('knockscout_basemap_sessions'); } catch (e) { /* ignore */ }
          Promise.all(tasks).then(finish, finish);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>KnockScout</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=7" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=7" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=7" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png?v=7" />
    <meta name="apple-mobile-web-app-title" content="KnockScout" />
    <meta name="application-name" content="KnockScout" />
    <link rel="manifest" href="/manifest.webmanifest?v=7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.googleapis.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin />
    <link rel="preload" href="/brand/knockscout-LogoMark-on-black.mp4" as="video" type="video/mp4" />
    <script>
      (function () {
        var h = window.innerHeight || 0;
        if (h > 0) {
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
      })();
    </script>
    <style>
      /*
       * iOS black-translucent PWA: use 100vh (not height:100% / fill-available) so
       * the shell fills the true screen. A short % height leaves a bottom dead band;
       * after ce50bfe that band is pure #000 under the action bar.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--vw-height, 100vh);
        background: #000000 !important;
        color-scheme: dark;
        overflow: hidden;
      }
      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--vw-height, 100vh);
        background: #000000;
      }
      /* Critical boot loader — full-bleed cover video until React fades it out */
      #initial-loader {
        position: fixed;
        inset: 0;
        /* Above #modal-root chrome while the splash is up */
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000 !important;
        overflow: hidden;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--vw-height, 100vh);
        opacity: 1;
      }
      #initial-loader.is-exiting {
        animation: boot-loader-fade-out 0.32s ease forwards;
        pointer-events: none;
      }
      @keyframes boot-loader-fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      /*
       * Cover the viewport so the centered logo mark reads at a sensible size
       * on phones (the MP4 is 16:9 with a small mark). Do not reparent this
       * element — iOS glitches when a playing <video> moves in the DOM.
       */
      #initial-loader #boot-logo-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        background: #000000;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader #boot-logo-video { display: none !important; }
      }
      /* Firebase OAuth relay iframes — keep off-screen if layout glitches */
      iframe[src*="/__/auth/"],
      iframe[src*=".firebaseapp.com/__/auth"] {
        position: fixed !important;
        left: -9999px !important;
        top: 0 !important;
        width: 0 !important;
        height: 0 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        border: 0 !important;
        clip: rect(0, 0, 0, 0) !important;
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        var ruler = document.createElement('div');
        // Measure 100vh only — -webkit-fill-available can be the short safe-area box on iOS.
        ruler.style.cssText = 'position:fixed;width:1px;height:100vh;top:0;left:0;pointer-events:none;visibility:hidden;';
        document.body.appendChild(ruler);
        function setViewportHeight() {
          var h = Math.max(ruler.offsetHeight || 0, window.innerHeight || 0);
          if (!(h > 0)) return;
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
        setViewportHeight();
        requestAnimationFrame(setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('resize', setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('scroll', setViewportHeight);
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);
        window.addEventListener('load', setViewportHeight);
      })();
    </script>
    <!-- Keep boot splash outside #root so React mount cannot tear it down. -->
    <div id="initial-loader" aria-label="Loading KnockScout" role="status">
      <video
        id="boot-logo-video"
        class="boot-logo-video is-cover"
        src="/brand/knockscout-LogoMark-on-black.mp4"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>
    <div id="root"></div>
    <script>
      window.__removeInitialLoader = function() {
        var el = document.getElementById('initial-loader');
        if (el) el.remove();
      };
      (function() {
        var video = document.getElementById('boot-logo-video');
        if (!video) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          video.remove();
          return;
        }
        video.muted = true;
        video.defaultMuted = true;
        video.volume = 0;
        video.preload = 'auto';
        try {
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.setAttribute('muted', '');
        } catch (e) { /* ignore */ }
        // Start immediately — React keeps this element in place and fades it out.
        var startBootPlay = function() {
          try {
            var p = video.play();
            if (p && typeof p.catch === 'function') p.catch(function() {});
          } catch (e) { /* ignore */ }
        };
        video.addEventListener('loadeddata', startBootPlay, { once: true });
        video.addEventListener('canplay', startBootPlay, { once: true });
        startBootPlay();
      })();
    </script>
    <div id="modal-root" style="position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; isolation: isolate; background: transparent;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
