<!doctype html>
<html lang="en" data-ui-theme="dark">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var t = s.uiTheme;
            document.documentElement.dataset.uiTheme =
              t === 'light' ? 'light' : t === 'glass' ? 'glass' : 'dark';
            return;
          }
        } catch (e) { /* ignore */ }
        document.documentElement.dataset.uiTheme = 'dark';
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111" />
    <title>KnockScout</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-title" content="KnockScout" />
    <meta name="application-name" content="KnockScout" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      (function() {
        var ruler = document.createElement('div');
        ruler.style.cssText = 'position:fixed;width:1px;height:100vh;top:0;pointer-events:none;visibility:hidden;';
        document.body.appendChild(ruler);
        function setViewportHeight() {
          var h = ruler.offsetHeight || window.innerHeight;
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
        setViewportHeight();
        requestAnimationFrame(setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('resize', setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('scroll', setViewportHeight);
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('load', setViewportHeight);
      })();
    </script>
    <div id="root">
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0c;z-index:10045;">
        <img src="/icon-192.png" alt="" width="72" height="72" style="border-radius:16px;opacity:0.9;" />
      </div>
    </div>
    <script>
      window.__removeInitialLoader = function() {
        var el = document.getElementById('initial-loader');
        if (el) el.remove();
      };
    </script>
    <div id="modal-root" style="position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; isolation: isolate;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
