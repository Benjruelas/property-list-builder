  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var t = s.uiTheme;
            document.documentElement.dataset.uiTheme =
              t === 'light' ? 'light' : t === 'glass' ? 'glass' : 'dark';
            return;
          }
        } catch (e) { /* ignore */ }
        document.documentElement.dataset.uiTheme = 'dark';
      })();
    </script>
    <meta charset="UTF-8" />
    <script>
      /* iOS Home Screen recovery: prefer /recover.html (static) or ?recover=1 */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (!params.has('recover') && !params.has('nosw')) return;
          var finish = function () {
            params.delete('recover');
            params.delete('nosw');
            var q = params.toString();
            window.location.replace(window.location.pathname + (q ? '?' + q : '') + window.location.hash);
          };
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            );
          }
          if (typeof caches !== 'undefined' && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
            );
          }
          try { sessionStorage.removeItem('knockscout_basemap_sessions'); } catch (e) { /* ignore */ }
          Promise.all(tasks).then(finish, finish);
        } catch (e) { /* ignore */ }
      })();
    </script>

    <script>
      (function () {
        var h = window.innerHeight || 0;
        if (h > 0) {
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
      })();

    <style>
      /*
       * iOS black-translucent PWA: use 100vh (not height:100% / fill-available) so
       * the shell fills the true screen. A short % height leaves a bottom dead band;
       * after ce50bfe that band is pure #000 under the action bar.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--vw-height, 100vh);
        background: #000000 !important;
        color-scheme: dark;
        overflow: hidden;
      }
      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--vw-height, 100vh);
        background: #000000;
      }
      /* Critical boot loader — logo MP4 until React AppLoadingScreen takes over */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 10045;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000 !important;
        overflow: hidden;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--vw-height, 100vh);
      }
      /*
       * Keep the media element full-bleed + opacity 0 (not 1×1 offscreen).
       * iOS often skips decoding tiny/offscreen videos, so the canvas stays black.
       * On Apple WebKit we switch to .is-direct (visible video) — see boot script.
       */
      #initial-loader #boot-logo-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
        object-fit: contain;
      }
      #initial-loader #boot-logo-video.is-direct {
        inset: auto;
        top: 0;
        left: 50%;
        width: var(--ks-boot-logo-w, 100%);
        height: var(--ks-boot-logo-h, 100%);
        opacity: 1;
        z-index: 1;
        background: #000000;
        transform: translateX(-50%) scale(var(--ks-logo-splash-scale, 1.875));
        transform-origin: center center;
      }
      #initial-loader #boot-logo-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--vw-height, 100vh);
        display: block;
        background: #000000;
        z-index: 1;
      }
      #initial-loader #boot-logo-canvas.is-direct-hidden {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader #boot-logo-video,
        #initial-loader #boot-logo-canvas { display: none !important; }
      }
      /* Firebase OAuth relay iframes — keep off-screen if layout glitches */
      iframe[src*="/__/auth/"],
      iframe[src*=".firebaseapp.com/__/auth"] {
        position: fixed !important;
        left: -9999px !important;
        top: 0 !important;
        width: 0 !important;
        height: 0 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        border: 0 !important;
        clip: rect(0, 0, 0, 0) !important;
      }
    </style>

  <body>
    <script>
      (function() {
        var ruler = document.createElement('div');
        // Measure 100vh only — -webkit-fill-available can be the short safe-area box on iOS.
        ruler.style.cssText = 'position:fixed;width:1px;height:100vh;top:0;left:0;pointer-events:none;visibility:hidden;';
        document.body.appendChild(ruler);
        function setViewportHeight() {
          var h = Math.max(ruler.offsetHeight || 0, window.innerHeight || 0);
          if (!(h > 0)) return;
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
        setViewportHeight();
        requestAnimationFrame(setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('resize', setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('scroll', setViewportHeight);
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);
        window.addEventListener('load', setViewportHeight);
      })();
    </script>
    <!-- Keep boot splash outside #root so React mount cannot tear it down. -->
    <div id="initial-loader" aria-label="Loading KnockScout" role="status">
      <video
        id="boot-logo-video"
        class="boot-logo-video"
        src="/brand/knockscout-LogoMark-on-black.mp4"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
      <canvas id="boot-logo-canvas" aria-hidden="true"></canvas>
    </div>
    <div id="root"></div>
    <script>
      window.__removeInitialLoader = function() {
        if (typeof window.__stopBootLogoMirror === 'function') {
          window.__stopBootLogoMirror();
          window.__stopBootLogoMirror = null;
        }
        var el = document.getElementById('initial-loader');
        if (el) el.remove();
      };
      (function() {
        var video = document.getElementById('boot-logo-video');
        var canvas = document.getElementById('boot-logo-canvas');
        if (!video || !canvas) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          video.remove();
          canvas.remove();
          return;
        }

        var LOGO_SCALE_MOBILE = 1.875;
        var LOGO_SCALE_DESKTOP = 1.0;
        var LOGO_DESKTOP_MIN = 768;
        var logoSplashScale = function() {
          return window.matchMedia('(min-width: ' + LOGO_DESKTOP_MIN + 'px)').matches
            ? LOGO_SCALE_DESKTOP
            : LOGO_SCALE_MOBILE;
        };
        // Apple mobile WebKit / Capacitor iOS: show the real <video>. Canvas
        // mirroring + seek-to-0 handoff breaks after iOS 26 media changes.
        var prefersDirect = false;
        try {
          if (window.Capacitor && typeof window.Capacitor.getPlatform === 'function'
              && window.Capacitor.getPlatform() === 'ios') {
            prefersDirect = true;
          }
        } catch (e) { /* ignore */ }
        var ua = (navigator.userAgent || '');
        if (/iP(hone|od|ad)/.test(ua)) prefersDirect = true;
        if (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1) {
          prefersDirect = true;
        }

        var lockLayout = function() {
          var cssW = Math.max(1, Math.round(window.innerWidth || 1));
          var cssH = Math.max(1, Math.round(window.innerHeight || 1));
          var locked = window.__bootLogoLayout;
          if (!locked || !(locked.w > 0) || !(locked.h > 0)) {
            locked = { w: cssW, h: cssH };
            window.__bootLogoLayout = locked;
          }
          return locked;
        };

        video.muted = true;
        video.defaultMuted = true;
        video.volume = 0;
        video.preload = 'auto';
        try {
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.setAttribute('muted', '');
        } catch (e) { /* ignore */ }

        if (prefersDirect) {
          var locked = lockLayout();
          canvas.classList.add('is-direct-hidden');
          video.classList.add('is-direct');
          video.style.setProperty('--ks-logo-splash-scale', String(logoSplashScale()));
          video.style.setProperty('--ks-boot-logo-w', locked.w + 'px');
          video.style.setProperty('--ks-boot-logo-h', locked.h + 'px');
          window.__stopBootLogoMirror = function() {};
        } else {
          var ctx = null;
          try {
            ctx = canvas.getContext('2d', { alpha: false, colorSpace: 'srgb' });
          } catch (e) {
            ctx = canvas.getContext('2d', { alpha: false });
          }
          if (!ctx) {
            // Still attempt unmuted-path play so splash is not blank if canvas fails.
          } else {
            var raf = 0;
            var EDGE_COVER_RATIO = 0.035;
            var EDGE_COVER_MIN_PX = 3;
            var EDGE_COVER_TOP_RATIO = 0.12;
            var EDGE_COVER_TOP_MIN_PX = 14;
            var plateFill = '#000000';
            // iOS / Capacitor often expose a neutral grey placeholder before real decode
            // (dark #111 through classic mid-grey). Keep the plate pure black until a
            // real logo frame arrives.
            var isGreyPlaceholder = function(r, g, b) {
              var max = Math.max(r, g, b);
              var min = Math.min(r, g, b);
              if (max <= 12) return false;
              return (max - min) <= 28 && max <= 220;
            };
            var probe = document.createElement('canvas');
            probe.width = 48;
            probe.height = 48;
            var probeCtx = null;
            try {
              probeCtx = probe.getContext('2d', { alpha: false, colorSpace: 'srgb' });
            } catch (e) {
              probeCtx = probe.getContext('2d', { alpha: false });
            }
            var fillPlate = function() {
              ctx.fillStyle = plateFill;
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            };
            // Freeze logo center to first measured CSS box so iOS/PWA viewport growth
            // only expands the black plate (React reuses window.__bootLogoLayout).
            var syncSize = function() {
              var dpr = Math.min(window.devicePixelRatio || 1, 2);
              var cssW = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth));
              var cssH = Math.max(1, Math.round(canvas.clientHeight || window.innerHeight));
              var lockedBox = window.__bootLogoLayout;
              if (!lockedBox || !(lockedBox.w > 0) || !(lockedBox.h > 0)) {
                lockedBox = { w: cssW, h: cssH };
                window.__bootLogoLayout = lockedBox;
              }
              var w = Math.round(cssW * dpr);
              var h = Math.round(cssH * dpr);
              if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
                fillPlate();
              }
              return { cssW: cssW, cssH: cssH, dpr: dpr, lockedW: lockedBox.w, lockedH: lockedBox.h };
            };
            var paint = function() {
              var size = syncSize();
              fillPlate();
              if (!(video.readyState >= 2 && video.videoWidth > 0) || !probeCtx) return;
              probeCtx.drawImage(video, 0, 0, probe.width, probe.height);
              var r = 0, g = 0, b = 0;
              try {
                var pix = probeCtx.getImageData(4, 4, 1, 1).data;
                r = pix[0]; g = pix[1]; b = pix[2];
              } catch (e) { return; }
              if (isGreyPlaceholder(r, g, b)) return;
              var vw = video.videoWidth;
              var vh = video.videoHeight;
              var fit = Math.min(size.lockedW / vw, size.lockedH / vh) * logoSplashScale();
              var dw = vw * fit * size.dpr;
              var dh = vh * fit * size.dpr;
              var dx = (size.lockedW * size.dpr - dw) / 2;
              var dy = (size.lockedH * size.dpr - dh) / 2;
              ctx.drawImage(video, dx, dy, dw, dh);
              var coverBottom = Math.max(EDGE_COVER_MIN_PX * size.dpr, Math.round(dh * EDGE_COVER_RATIO));
              var coverTop = Math.max(EDGE_COVER_TOP_MIN_PX * size.dpr, Math.round(dh * EDGE_COVER_TOP_RATIO));
              ctx.fillStyle = plateFill;
              ctx.fillRect(dx, dy, dw, coverTop);
              ctx.fillRect(dx, dy + dh - coverBottom, dw, coverBottom);
            };
            syncSize();
            fillPlate();
            var draw = function() {
              paint();
              raf = requestAnimationFrame(draw);
            };
            draw();
            window.addEventListener('resize', paint);
            window.__stopBootLogoMirror = function() {
              cancelAnimationFrame(raf);
              window.removeEventListener('resize', paint);
            };
          }
        }

        // Start muted playback immediately on all platforms. React continues
        // without seeking to t=0 so the HTML→React handoff does not restart.
        lockLayout();
        var startBootPlay = function() {
          try {
            var p = video.play();
            if (p && typeof p.catch === 'function') p.catch(function() {});
          } catch (e) { /* ignore */ }
        };
        video.addEventListener('loadeddata', startBootPlay, { once: true });
        video.addEventListener('canplay', startBootPlay, { once: true });
        startBootPlay();
      })();
    </script>
