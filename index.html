<!doctype html>
<html lang="en" data-ui-theme="dark">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var t = s.uiTheme;
            document.documentElement.dataset.uiTheme =
              t === 'light' ? 'light' : t === 'glass' ? 'glass' : 'dark';
            return;
          }
        } catch (e) { /* ignore */ }
        document.documentElement.dataset.uiTheme = 'dark';
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#060912" />
    <title>KnockScout</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=6" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=6" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=6" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=6" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png?v=6" />
    <meta name="apple-mobile-web-app-title" content="KnockScout" />
    <meta name="application-name" content="KnockScout" />
    <link rel="manifest" href="/manifest.webmanifest?v=6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.googleapis.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin />
    <style>
      /* Critical boot loader — mirrors AppLoadingScreen until React takes over */
      @keyframes boot-aurora-a {
        0%, 100% { transform: translate3d(-8%, -4%, 0) scale(1) rotate(0deg); }
        50% { transform: translate3d(10%, 8%, 0) scale(1.12) rotate(8deg); }
      }
      @keyframes boot-aurora-b {
        0%, 100% { transform: translate3d(6%, 4%, 0) scale(1.05) rotate(0deg); }
        50% { transform: translate3d(-12%, -6%, 0) scale(1.18) rotate(-10deg); }
      }
      @keyframes boot-aurora-c {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.45; }
        50% { transform: translate3d(-4%, 10%, 0) scale(1.2); opacity: 0.7; }
      }
      @keyframes boot-sheen {
        0% { transform: translateX(-40%) rotate(12deg); opacity: 0; }
        30% { opacity: 0.35; }
        55% { opacity: 0.2; }
        100% { transform: translateX(60%) rotate(12deg); opacity: 0; }
      }
      @keyframes boot-bloom {
        0%, 100% { transform: scale(0.92); opacity: 0.45; }
        50% { transform: scale(1.08); opacity: 0.75; }
      }
      @keyframes boot-lockup {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.025); }
      }
      @keyframes boot-tagline { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.92; } }
      @keyframes boot-progress {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(220%); }
      }
      #initial-loader {
        --ks-blue: #1151ef;
        --ks-ink: #060912;
        position: fixed;
        inset: 0;
        z-index: 10045;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ks-ink);
        overflow: hidden;
        margin: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #initial-loader .boot-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      #initial-loader .boot-wash {
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(ellipse 70% 55% at 50% 38%, rgba(17, 81, 239, 0.28) 0%, transparent 58%),
          radial-gradient(ellipse 55% 45% at 78% 78%, rgba(17, 81, 239, 0.16) 0%, transparent 60%),
          radial-gradient(ellipse 50% 40% at 18% 72%, rgba(56, 120, 255, 0.12) 0%, transparent 55%),
          linear-gradient(180deg, #0a1224 0%, var(--ks-ink) 48%, #04060d 100%);
      }
      #initial-loader .boot-aurora {
        position: absolute;
        border-radius: 50%;
        filter: blur(56px);
        will-change: transform;
      }
      #initial-loader .boot-aurora--a {
        width: min(88vw, 420px);
        height: min(88vw, 420px);
        top: -8%;
        left: 18%;
        background: radial-gradient(circle, rgba(17, 81, 239, 0.55) 0%, rgba(17, 81, 239, 0.08) 48%, transparent 70%);
        animation: boot-aurora-a 11s ease-in-out infinite;
      }
      #initial-loader .boot-aurora--b {
        width: min(75vw, 360px);
        height: min(75vw, 360px);
        right: -12%;
        bottom: 8%;
        background: radial-gradient(circle, rgba(56, 120, 255, 0.4) 0%, transparent 68%);
        animation: boot-aurora-b 14s ease-in-out infinite;
      }
      #initial-loader .boot-aurora--c {
        width: min(60vw, 280px);
        height: min(60vw, 280px);
        left: -8%;
        bottom: 18%;
        background: radial-gradient(circle, rgba(96, 156, 255, 0.28) 0%, transparent 70%);
        animation: boot-aurora-c 9s ease-in-out infinite;
      }
      #initial-loader .boot-sheen {
        position: absolute;
        top: -30%;
        left: 0;
        width: 42%;
        height: 160%;
        background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.03) 42%, rgba(147,197,253,0.1) 50%, rgba(255,255,255,0.03) 58%, transparent 100%);
        animation: boot-sheen 7.5s ease-in-out infinite;
      }
      #initial-loader .boot-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        padding: 2rem;
      }
      #initial-loader .boot-mark {
        position: relative;
        width: min(20rem, 84vw);
        min-height: 5.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem 0.5rem;
      }
      #initial-loader .boot-bloom {
        position: absolute;
        inset: 0% 2%;
        border-radius: 40%;
        background: radial-gradient(circle, rgba(17, 81, 239, 0.5) 0%, rgba(17, 81, 239, 0.12) 42%, transparent 70%);
        filter: blur(22px);
        animation: boot-bloom 3.4s ease-in-out infinite;
      }
      #initial-loader .boot-lockup {
        position: relative;
        z-index: 1;
        width: min(20rem, 84vw);
        height: auto;
        aspect-ratio: 3006 / 917;
        object-fit: contain;
        filter: drop-shadow(0 12px 28px rgba(17, 81, 239, 0.28));
        animation: boot-lockup 3.2s ease-in-out infinite;
      }
      #initial-loader .boot-tagline {
        font-family: 'Sora', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: rgba(186, 198, 220, 0.92);
        animation: boot-tagline 2.6s ease-in-out infinite;
      }
      #initial-loader .boot-progress {
        width: min(11rem, 52vw);
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      #initial-loader .boot-progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #1151ef 35%, #7dd3fc 55%, #1151ef 75%, transparent);
        box-shadow: 0 0 12px rgba(17, 81, 239, 0.55);
        animation: boot-progress 1.55s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .boot-aurora,
        #initial-loader .boot-sheen,
        #initial-loader .boot-bloom,
        #initial-loader .boot-lockup,
        #initial-loader .boot-tagline,
        #initial-loader .boot-progress-fill { animation: none !important; }
        #initial-loader .boot-tagline { opacity: 0.75; }
      }
      /* Firebase OAuth relay iframes — keep off-screen if layout glitches */
      iframe[src*="/__/auth/"],
      iframe[src*=".firebaseapp.com/__/auth"] {
        position: fixed !important;
        left: -9999px !important;
        top: 0 !important;
        width: 0 !important;
        height: 0 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        border: 0 !important;
        clip: rect(0, 0, 0, 0) !important;
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        var ruler = document.createElement('div');
        ruler.style.cssText = 'position:fixed;width:1px;height:100vh;top:0;pointer-events:none;visibility:hidden;';
        document.body.appendChild(ruler);
        function setViewportHeight() {
          var h = ruler.offsetHeight || window.innerHeight;
          document.documentElement.style.setProperty('--vw-height', h + 'px');
        }
        setViewportHeight();
        requestAnimationFrame(setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('resize', setViewportHeight);
        window.visualViewport && window.visualViewport.addEventListener('scroll', setViewportHeight);
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('load', setViewportHeight);
      })();
    </script>
    <div id="root">
      <div id="initial-loader" aria-label="Loading KnockScout" role="status">
        <div class="boot-bg" aria-hidden="true">
          <div class="boot-wash"></div>
          <div class="boot-aurora boot-aurora--a"></div>
          <div class="boot-aurora boot-aurora--b"></div>
          <div class="boot-aurora boot-aurora--c"></div>
          <div class="boot-sheen"></div>
        </div>
        <div class="boot-content">
          <div class="boot-mark">
            <div class="boot-bloom"></div>
            <img src="/brand/lockup-variant-2.svg" alt="KnockScout" class="boot-lockup" width="320" height="98" />
          </div>
          <span class="boot-tagline" id="boot-tagline">Loading your map…</span>
          <div class="boot-progress">
            <div class="boot-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-tagline');
        if (!el) return;
        var p = new URLSearchParams(window.location.search);
        if (p.get('quote')) el.textContent = 'Loading quote…';
        else if (p.get('report')) el.textContent = 'Loading report…';
        else if (p.get('form')) el.textContent = 'Loading form…';
      })();
    </script>
    <script>
      window.__removeInitialLoader = function() {
        var el = document.getElementById('initial-loader');
        if (el) el.remove();
      };
    </script>
    <div id="modal-root" style="position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; isolation: isolate;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
