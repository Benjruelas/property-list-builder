name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (high severity, blocking with documented exceptions)
        run: npm audit --audit-level=high

      - name: API security regression tests
        run: npm test -- api/lib/__tests__/formPdfKey.test.js api/lib/__tests__/reportPdfGenerateImport.test.js api/lib/__tests__/previewToken.test.js
