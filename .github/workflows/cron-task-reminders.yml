# Frequent task-reminder ticks.
#
# Vercel Hobby only allows once-per-day crons in vercel.json; expressions like
# */5 fail the entire deployment. Keep a daily Vercel cron as a backup and use
# this workflow for ~5 minute cadence when CRON_SECRET + APP_ORIGIN are set
# as repository secrets.
name: Task reminder cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron-task-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not configured in GitHub secrets — skipping."
            exit 0
          fi
          ORIGIN="${APP_ORIGIN:-https://knockscout.app}"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ORIGIN%/}/api/cron-task-reminders"
